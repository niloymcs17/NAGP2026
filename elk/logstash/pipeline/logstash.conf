input {
  beats {
    port => 5044
  }
}

filter {
  # The message field is already a JSON string from LogstashEncoder
  if [message] =~ /^\{/ {
    json {
      source => "message"
      target => "app"
    }

    # Parse application timestamp into @timestamp with nanosecond precision support
    if [app][@timestamp] {
      # Truncate high-precision fractional seconds to milliseconds for Joda-Time compatibility
      mutate {
        gsub => [ "[app][@timestamp]", '(\.\d{3})\d+', '\1' ]
      }
      date {
        match => ["[app][@timestamp]", "ISO8601"]
        target => "@timestamp"
      }
      mutate {
        remove_field => ["[app][@timestamp]"]
      }
    }

    # Hoist all other parsed fields to the root level
    ruby {
      code => "
        app = event.get('app')
        if app.is_a?(Hash)
          app.each do |k, v|
            event.set(k, v)
          end
        end
      "
    }

    # Clean up the temporary object
    mutate {
      remove_field => ["app"]
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "leave-portal-logs-%{+YYYY.MM.dd}"
  }
  stdout {
    codec => rubydebug
  }
}
