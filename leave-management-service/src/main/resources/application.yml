server:
  port: 8083

spring:
  application:
    name: leave-management-service
  datasource:
    url: jdbc:h2:mem:leavedb;DB_CLOSE_DELAY=-1
    driverClassName: org.h2.Driver
    username: sa
    password: password
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
  h2:
    console:
      enabled: true
      path: /h2-console
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    listener:
      simple:
        observation-enabled: true
    template:
      observation-enabled: true

eureka:
  instance:
    prefer-ip-address: true
    # hostname removed — each Docker container registers its own IP with Eureka,
    # enabling the load balancer to route to distinct instances when scaled
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

# ── Distributed Tracing ──────────────────────────────────────────────────────
management:
  otlp:
    tracing:
      endpoint: http://localhost:4318/v1/traces
  tracing:
    sampling:
      probability: 1.0

# ── Logging ──────────────────────────────────────────────────────────────────
logging:
  level:
    root: INFO
    com.niloy: DEBUG
    org.springframework: WARN
    org.hibernate: WARN
