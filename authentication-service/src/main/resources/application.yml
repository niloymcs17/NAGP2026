server:
  port: 8081

spring:
  application:
    name: authentication-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/authdb}
    driverClassName: org.postgresql.Driver
    username: ${SPRING_DATASOURCE_USERNAME:admin}
    password: ${SPRING_DATASOURCE_PASSWORD:admin}
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update

eureka:
  instance:
    prefer-ip-address: true
    # hostname removed — each Docker container registers its own IP with Eureka,
    # enabling the load balancer to route to distinct instances when scaled
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

jwt:
  secret: 3cO0m6pP9qRsTuVwXyZ1a2b3c4d5e6f7g8h9i0j1k2l3m4n5o6p7q8r9s0t1u2v3
  expiration-ms: 86400000

# ── Distributed Tracing ──────────────────────────────────────────────────────
management:
  otlp:
    tracing:
      endpoint: http://localhost:4318/v1/traces
  tracing:
    sampling:
      probability: 1.0

# ── Logging ──────────────────────────────────────────────────────────────────
logging:
  level:
    root: INFO
    com.niloy: DEBUG
    org.springframework: WARN
    org.hibernate: WARN
