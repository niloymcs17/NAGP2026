server:
  port: 8084

spring:
  application:
    name: notification-service
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    listener:
      simple:
        observation-enabled: true
    template:
      observation-enabled: true

eureka:
  instance:
    prefer-ip-address: true
    hostname: localhost
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

# ── Distributed Tracing ──────────────────────────────────────────────────────
management:
  otlp:
    tracing:
      endpoint: http://localhost:4318/v1/traces
  tracing:
    sampling:
      probability: 1.0

# ── Logging ──────────────────────────────────────────────────────────────────
logging:
  level:
    root: INFO
    com.niloy: DEBUG
    org.springframework: WARN
    org.hibernate: WARN
